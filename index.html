<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>John & i Molesti — Setlist</title>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- DRAG & DROP -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;
      color: #fff;
    }


    button,
    input {
      font-family: inherit;
    }


    button {
      cursor: pointer;
    }


    /* =========================================
       LOGIN
       ========================================= */


    #loginScreen {

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

    }


    .login-box {

      width: min(360px, 100%);

      padding: 28px;

      background: #181818;

      border: 1px solid #333;

      border-radius: 12px;

    }


    .login-box h1 {

      margin: 0;

      font-size: 25px;

    }


    .login-subtitle {

      margin-top: 4px;
      margin-bottom: 24px;

      color: #888;

      font-size: 13px;

    }


    .login-box label {

      display: block;

      margin-top: 12px;
      margin-bottom: 5px;

      color: #aaa;

      font-size: 12px;

    }


    .login-box input {

      width: 100%;

      padding: 11px;

      background: #222;
      color: #fff;

      border: 1px solid #444;

      border-radius: 6px;

      font-size: 16px;

    }


    .login-box input:focus {

      outline: 1px solid #f0cf21;

      border-color: #f0cf21;

    }


    #loginButton {

      width: 100%;

      margin-top: 18px;

      padding: 11px;

      border: 0;

      border-radius: 6px;

      background: #f0cf21;

      color: #111;

      font-weight: bold;

      font-size: 14px;

    }


    #loginButton:disabled {

      opacity: 0.5;

      cursor: default;

    }


    #loginMessage {

      min-height: 18px;

      margin-top: 12px;

      color: #e38b8b;

      font-size: 12px;

      line-height: 1.4;

    }


    .first-access-note {

      margin-top: 15px;

      color: #666;

      font-size: 10px;

      line-height: 1.4;

      text-align: center;

    }



    /* =========================================
       APP
       ========================================= */


    #appScreen {

      display: none;

    }


    header {

      min-height: 42px;

      padding: 5px 12px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      background: #181818;

      border-bottom: 1px solid #333;

    }


    .brand h1 {

      margin: 0;

      font-size: 17px;

    }


    .brand p {

      margin: 1px 0 0;

      color: #777;

      font-size: 10px;

    }


    .user-area {

      display: flex;

      align-items: center;

      gap: 8px;

      color: #aaa;

      font-size: 11px;

    }


    #logoutButton {

      padding: 5px 8px;

      background: #282828;

      color: #ddd;

      border: 1px solid #444;

      border-radius: 5px;

      font-size: 10px;

    }



    /* =========================================
       CONTENUTO
       ========================================= */


    main {

      width: min(1400px, 100%);

      margin: 0 auto;

      padding: 6px 10px 10px;

    }


    .new-song {

      display: flex;

      gap: 5px;

      margin-bottom: 6px;

    }


    .new-song input {

      flex: 1;

      min-width: 0;

      height: 30px;

      padding: 4px 8px;

      background: #222;

      color: #fff;

      border: 1px solid #444;

      border-radius: 5px;

      font-size: 13px;

    }


    .new-song input:focus {

      outline: 1px solid #f0cf21;

      border-color: #f0cf21;

    }


    .new-song button {

      height: 30px;

      padding: 3px 12px;

      background: #f0cf21;

      color: #111;

      border: 0;

      border-radius: 5px;

      font-size: 11px;

      font-weight: bold;

    }



    /* =========================================
       COLONNE
       ========================================= */


    .columns {

      display: grid;

      grid-template-columns: 3fr 1fr;

      gap: 6px;

    }


    .panel {

      min-width: 0;

      background: #181818;

      border: 1px solid #333;

      border-radius: 6px;

      overflow: hidden;

    }


    .panel-header {

      height: 27px;

      padding: 3px 7px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #333;

    }


    .panel-header h2 {

      margin: 0;

      font-size: 12px;

    }


    .counter {

      color: #777;

      font-size: 9px;

    }



    /* =========================================
       CANZONI
       ========================================= */


    .song-list {

      min-height: 100px;

      padding: 2px;

    }


    .song {

      min-height: 20px;

      margin-bottom: 1px;

      padding: 1px 4px;

      display: flex;

      align-items: center;

      gap: 4px;

      background: #242424;

      border: 1px solid #333;

      border-radius: 3px;

    }


    .song:hover {

      border-color: #555;

    }


    .drag-handle {

      width: 12px;

      flex: 0 0 12px;

      color: #666;

      font-size: 11px;

      cursor: grab;

      user-select: none;

    }


    .drag-handle:active {

      cursor: grabbing;

    }


    .position {

      width: 16px;
      height: 16px;

      flex: 0 0 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #383838;

      border-radius: 50%;

      font-size: 8px;

      font-weight: bold;

    }


    .song-title {

      flex: 1;

      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 11px;

      line-height: 14px;

      font-weight: 600;

    }


    .song-actions {

      display: flex;

      flex: 0 0 auto;

      gap: 1px;

    }


    .song-actions button {

      min-width: 19px;

      height: 17px;

      padding: 0 3px;

      background: #353535;

      color: #ddd;

      border: 0;

      border-radius: 2px;

      font-size: 9px;

    }


    .song-actions button:hover {

      background: #505050;

    }


    .sortable-ghost {

      opacity: 0.2;

    }


    .sortable-chosen {

      border-color: #f0cf21;

    }


    .empty {

      padding: 20px;

      text-align: center;

      color: #666;

      font-size: 10px;

    }



    /* =========================================
       STATO
       ========================================= */


    #loadingMessage {

      display: none;

      padding: 30px;

      color: #888;

      text-align: center;

      font-size: 12px;

    }


    .footer-note {

      margin-top: 4px;

      color: #555;

      text-align: center;

      font-size: 9px;

    }



    /* =========================================
       MOBILE
       ========================================= */


    @media (max-width: 700px) {


      header {

        min-height: 48px;

      }


      .columns {

        grid-template-columns: 1fr;

      }


      .new-song input {

        font-size: 16px;

      }


      .song {

        min-height: 36px;

        padding: 4px 6px;

      }


      .song-title {

        font-size: 13px;

      }


      .drag-handle {

        width: 20px;

        flex-basis: 20px;

        font-size: 17px;

      }


      .position {

        width: 22px;
        height: 22px;

        flex-basis: 22px;

        font-size: 10px;

      }


      .song-actions button {

        min-width: 30px;

        height: 28px;

        font-size: 12px;

      }


    }

  </style>

</head>



<body>


  <!-- =========================================
       LOGIN
       ========================================= -->


  <section id="loginScreen">


    <form
      id="loginForm"
      class="login-box"
    >


      <h1>
        John & i Molesti
      </h1>


      <div class="login-subtitle">
        Setlist Builder
      </div>


      <label for="username">
        Username
      </label>


      <input
        id="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        required
      >


      <label for="password">
        Password
      </label>


      <input
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="6"
        required
      >


      <button
        id="loginButton"
        type="submit"
      >
        ACCEDI
      </button>


      <div id="loginMessage"></div>


      <div class="first-access-note">
        Al primo accesso la password inserita verrà associata al tuo account.
      </div>


    </form>


  </section>



  <!-- =========================================
       APP
       ========================================= -->


  <section id="appScreen">


    <header>


      <div class="brand">

        <h1>
          John & i Molesti
        </h1>

        <p>
          Setlist Builder
        </p>

      </div>


      <div class="user-area">

        <strong id="currentUser"></strong>

        <button
          id="logoutButton"
          type="button"
        >
          Esci
        </button>

      </div>


    </header>



    <main>


      <form
        id="newSongForm"
        class="new-song"
      >


        <input
          id="newSongTitle"
          type="text"
          placeholder="Nuova canzone..."
          autocomplete="off"
          required
        >


        <button type="submit">
          + AGGIUNGI
        </button>


      </form>



      <div id="loadingMessage">
        Caricamento...
      </div>



      <div
        id="setlistArea"
        class="columns"
      >


        <!-- SCALETTA -->

        <section class="panel">


          <div class="panel-header">

            <h2>
              LA MIA SCALETTA
            </h2>

            <span
              id="setlistCounter"
              class="counter"
            ></span>

          </div>


          <div
            id="setlist"
            class="song-list"
          ></div>


        </section>



        <!-- ESCLUSE -->

        <section class="panel">


          <div class="panel-header">

            <h2>
              ESCLUSE
            </h2>

            <span
              id="excludedCounter"
              class="counter"
            ></span>

          </div>


          <div
            id="excluded"
            class="song-list"
          ></div>


        </section>


      </div>



      <div class="footer-note">
        Trascina i brani per modificarne ordine e inclusione.
      </div>


    </main>


  </section>



  <script>


    /* =========================================
       SUPABASE
       ========================================= */


    const SUPABASE_URL =
      "https://etzwybamvfpeitkttwrc.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_CtyexwjoW375UXpjInOuDA_Uz28wWJx";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================
       STATO
       ========================================= */


    let currentUser = null;

    let currentProfile = null;

    let currentSetlistId = null;

    let songs = [];

    let setlistItems = [];



    /* =========================================
       ELEMENTI DOM
       ========================================= */


    const loginScreen =
      document.getElementById(
        "loginScreen"
      );


    const appScreen =
      document.getElementById(
        "appScreen"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const usernameInput =
      document.getElementById(
        "username"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const setlistElement =
      document.getElementById(
        "setlist"
      );


    const excludedElement =
      document.getElementById(
        "excluded"
      );



    /* =========================================
       SCHERMATE
       ========================================= */


    function showLogin() {

      loginScreen.style.display =
        "flex";

      appScreen.style.display =
        "none";

    }


    function showApp() {

      loginScreen.style.display =
        "none";

      appScreen.style.display =
        "block";

    }



    /* =========================================
       LOGIN
       ========================================= */


    loginForm.addEventListener(

      "submit",

      async event => {


        event.preventDefault();


        const username =
          usernameInput
            .value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        if (!username) {

          loginMessage.textContent =
            "Inserisci lo username.";

          return;

        }


        if (password.length < 6) {

          loginMessage.textContent =
            "La password deve contenere almeno 6 caratteri.";

          return;

        }


        loginButton.disabled =
          true;


        loginMessage.textContent =
          "Accesso in corso...";


        try {


          /* ---------------------------------
             CONTROLLO MEMBRO
             --------------------------------- */


          const {
            data: memberData,
            error: memberError
          } =
            await supabaseClient.rpc(

              "check_member",

              {
                p_username:
                  username
              }

            );


          if (memberError) {

            throw memberError;

          }


          if (
            !memberData ||
            memberData.length === 0
          ) {

            loginMessage.textContent =
              "Username non riconosciuto.";

            return;

          }


          const member =
            memberData[0];


          const email =
            username +
            "@johnimolesti.app";



          /* ---------------------------------
             PRIMO ACCESSO
             --------------------------------- */


          if (!member.activated) {


            loginMessage.textContent =
              "Primo accesso: creazione account...";


            const {
              data: signUpData,
              error: signUpError
            } =
              await supabaseClient
                .auth
                .signUp({

                  email:
                    email,

                  password:
                    password

                });



            /*
              Può capitare che un account Auth
              sia già stato creato in un tentativo
              precedente, ma il membro non sia
              ancora stato collegato.

              In quel caso proviamo semplicemente
              ad accedere con la password inserita.
            */


            if (signUpError) {


              const {
                error: recoveryLoginError
              } =
                await supabaseClient
                  .auth
                  .signInWithPassword({

                    email:
                      email,

                    password:
                      password

                  });


              if (recoveryLoginError) {

                throw signUpError;

              }

            }


            else {


              if (!signUpData.session) {

                loginMessage.textContent =
                  "Account creato, ma Supabase richiede la conferma email. Disattiva Confirm Email in Authentication.";

                return;

              }

            }



            /* Collega account Auth al membro */


            const {
              error: claimError
            } =
              await supabaseClient.rpc(

                "claim_member",

                {
                  p_username:
                    username
                }

              );


            if (claimError) {

              throw claimError;

            }


          }



          /* ---------------------------------
             ACCESSO NORMALE
             --------------------------------- */


          else {


            const {
              error: signInError
            } =
              await supabaseClient
                .auth
                .signInWithPassword({

                  email:
                    email,

                  password:
                    password

                });


            if (signInError) {

              loginMessage.textContent =
                "Password errata.";

              return;

            }


          }



          loginMessage.textContent =
            "";


          await startApp();


        }


        catch (error) {


          console.error(
            "Errore login:",
            error
          );


          loginMessage.textContent =
            error?.message ||
            "Errore durante l'accesso.";


        }


        finally {


          loginButton.disabled =
            false;


        }


      }

    );



    /* =========================================
       AVVIO UTENTE
       ========================================= */


    async function startApp() {


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getUser();


      if (error) {

        throw error;

      }


      const user =
        data.user;


      if (!user) {

        showLogin();

        return;

      }


      currentUser =
        user;



      /* ---------------------------------
         PROFILO
         --------------------------------- */


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient

          .from(
            "profiles"
          )

          .select(
            "*"
          )

          .eq(
            "id",
            user.id
          )

          .single();



      if (profileError) {


        console.error(
          profileError
        );


        await supabaseClient
          .auth
          .signOut();


        showLogin();


        loginMessage.textContent =
          "Profilo utente non trovato.";


        return;


      }


      currentProfile =
        profile;


      document
        .getElementById(
          "currentUser"
        )
        .textContent =
        profile.display_name;


      showApp();


      await ensureDefaultSetlist();


      await loadData();


    }



    /* =========================================
       SCALETTA IDEALE
       ========================================= */


    async function ensureDefaultSetlist() {


      const {
        data,
        error
      } =
        await supabaseClient

          .from(
            "setlists"
          )

          .select(
            "id"
          )

          .eq(
            "owner_id",
            currentUser.id
          )

          .eq(
            "name",
            "Scaletta ideale"
          )

          .limit(
            1
          );


      if (error) {

        throw error;

      }


      if (
        data &&
        data.length > 0
      ) {


        currentSetlistId =
          data[0].id;


        return;


      }



      const {
        data: created,
        error: createError
      } =
        await supabaseClient

          .from(
            "setlists"
          )

          .insert({

            owner_id:
              currentUser.id,

            name:
              "Scaletta ideale"

          })

          .select(
            "id"
          )

          .single();



      if (createError) {

        throw createError;

      }


      currentSetlistId =
        created.id;


    }



    /* =========================================
       CARICAMENTO DATI
       ========================================= */


    async function loadData() {


      const loading =
        document.getElementById(
          "loadingMessage"
        );


      loading.style.display =
        "block";


      try {


        /* ---------------------------------
           CANZONI
           --------------------------------- */


        const {
          data: songsData,
          error: songsError
        } =
          await supabaseClient

            .from(
              "songs"
            )

            .select(
              "*"
            )

            .eq(
              "active",
              true
            )

            .order(
              "created_at",
              {
                ascending:
                  true
              }
            );


        if (songsError) {

          throw songsError;

        }


        songs =
          songsData || [];



        /* ---------------------------------
           ELEMENTI SCALETTA
           --------------------------------- */


        const {
          data: itemsData,
          error: itemsError
        } =
          await supabaseClient

            .from(
              "setlist_items"
            )

            .select(
              "*"
            )

            .eq(
              "setlist_id",
              currentSetlistId
            );


        if (itemsError) {

          throw itemsError;

        }


        setlistItems =
          itemsData || [];



        /*
          PRIMO AVVIO DELLA SCALETTA:

          se non esiste ancora alcun elemento,
          inseriamo tutte le canzoni presenti
          nel catalogo.
        */


        if (
          setlistItems.length === 0 &&
          songs.length > 0
        ) {


          const rows =
            songs.map(
              (song, index) => ({

                setlist_id:
                  currentSetlistId,

                song_id:
                  song.id,

                position:
                  index,

                included:
                  true

              })
            );


          const {
            error: insertError
          } =
            await supabaseClient

              .from(
                "setlist_items"
              )

              .insert(
                rows
              );


          if (insertError) {

            throw insertError;

          }


          setlistItems =
            rows;


        }


        render();


      }


      catch (error) {


        console.error(
          "Errore caricamento:",
          error
        );


        alert(
          "Errore caricamento dati: " +
          error.message
        );


      }


      finally {


        loading.style.display =
          "none";


      }


    }



    /* =========================================
       LISTE
       ========================================= */


    function getItemsMap() {


      return new Map(

        setlistItems.map(
          item => [

            item.song_id,

            item

          ]
        )

      );


    }



    function getIncludedSongs() {


      const map =
        getItemsMap();


      return songs

        .filter(
          song => {

            const item =
              map.get(
                song.id
              );


            return (
              item &&
              item.included
            );

          }
        )

        .sort(
          (a, b) => {

            const itemA =
              map.get(
                a.id
              );

            const itemB =
              map.get(
                b.id
              );


            return (
              (itemA.position ?? 9999) -
              (itemB.position ?? 9999)
            );

          }
        );


    }



    function getExcludedSongs() {


      const map =
        getItemsMap();


      return songs

        .filter(
          song => {

            const item =
              map.get(
                song.id
              );


            return (
              !item ||
              !item.included
            );

          }
        )

        .sort(
          (a, b) =>
            a.title.localeCompare(
              b.title,
              "it"
            )
        );


    }



    /* =========================================
       RENDER
       ========================================= */


    function render() {


      setlistElement.innerHTML =
        "";


      excludedElement.innerHTML =
        "";


      const includedSongs =
        getIncludedSongs();


      const excludedSongs =
        getExcludedSongs();



      /* ---------------------------------
         INCLUSE
         --------------------------------- */


      if (
        includedSongs.length === 0
      ) {


        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty";


        empty.textContent =
          "Nessun brano in scaletta";


        setlistElement.appendChild(
          empty
        );


      }


      else {


        includedSongs.forEach(

          (song, index) => {


            setlistElement.appendChild(

              createSongElement(
                song,
                index,
                true
              )

            );


          }

        );


      }



      /* ---------------------------------
         ESCLUSE
         --------------------------------- */


      if (
        excludedSongs.length === 0
      ) {


        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty";


        empty.textContent =
          "Nessun brano escluso";


        excludedElement.appendChild(
          empty
        );


      }


      else {


        excludedSongs.forEach(

          (song, index) => {


            excludedElement.appendChild(

              createSongElement(
                song,
                index,
                false
              )

            );


          }

        );


      }



      document
        .getElementById(
          "setlistCounter"
        )
        .textContent =
        includedSongs.length +
        " brani";


      document
        .getElementById(
          "excludedCounter"
        )
        .textContent =
        excludedSongs.length +
        " brani";


    }



    /* =========================================
       ELEMENTO CANZONE
       ========================================= */


    function createSongElement(
      song,
      index,
      included
    ) {


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "song";


      element.dataset.id =
        song.id;



      /* DRAG */


      const drag =
        document.createElement(
          "span"
        );


      drag.className =
        "drag-handle";


      drag.textContent =
        "☰";


      drag.title =
        "Trascina";



      /* NUMERO */


      const position =
        document.createElement(
          "span"
        );


      position.className =
        "position";


      position.textContent =
        index + 1;



      /* TITOLO */


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "song-title";


      title.textContent =
        song.title;


      title.title =
        song.title;



      /* AZIONI */


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "song-actions";



      /* MODIFICA */


      const editButton =
        document.createElement(
          "button"
        );


      editButton.type =
        "button";


      editButton.textContent =
        "✎";


      editButton.title =
        "Modifica canzone";


      editButton.addEventListener(

        "click",

        () =>
          editSong(
            song
          )

      );


      actions.appendChild(
        editButton
      );



      /* INCLUSIONE */


      if (included) {


        const excludeButton =
          document.createElement(
            "button"
          );


        excludeButton.type =
          "button";


        excludeButton.textContent =
          "×";


        excludeButton.title =
          "Escludi dalla scaletta";


        excludeButton.addEventListener(

          "click",

          () =>
            setSongIncluded(
              song.id,
              false
            )

        );


        actions.appendChild(
          excludeButton
        );


      }


      else {


        const includeButton =
          document.createElement(
            "button"
          );


        includeButton.type =
          "button";


        includeButton.textContent =
          "+";


        includeButton.title =
          "Inserisci in scaletta";


        includeButton.addEventListener(

          "click",

          () =>
            setSongIncluded(
              song.id,
              true
            )

        );


        actions.appendChild(
          includeButton
        );



        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.type =
          "button";


        deleteButton.textContent =
          "🗑";


        deleteButton.title =
          "Elimina dal catalogo";


        deleteButton.addEventListener(

          "click",

          () =>
            deleteSong(
              song
            )

        );


        actions.appendChild(
          deleteButton
        );


      }



      element.appendChild(
        drag
      );


      if (included) {

        element.appendChild(
          position
        );

      }


      element.appendChild(
        title
      );


      element.appendChild(
        actions
      );


      return element;


    }



    /* =========================================
       NUOVA CANZONE
       ========================================= */


    document
      .getElementById(
        "newSongForm"
      )
      .addEventListener(

        "submit",

        async event => {


          event.preventDefault();


          const input =
            document.getElementById(
              "newSongTitle"
            );


          const title =
            input
              .value
              .trim();


          if (!title) {

            return;

          }



          const {
            data: newSong,
            error
          } =
            await supabaseClient

              .from(
                "songs"
              )

              .insert({

                title:
                  title

              })

              .select(
                "*"
              )

              .single();



          if (error) {


            alert(
              "Errore: " +
              error.message
            );


            return;


          }



          /*
            Il membro che crea la canzone
            la riceve automaticamente
            in fondo alla propria scaletta.
          */


          const {
            error: itemError
          } =
            await supabaseClient

              .from(
                "setlist_items"
              )

              .insert({

                setlist_id:
                  currentSetlistId,

                song_id:
                  newSong.id,

                position:
                  getIncludedSongs().length,

                included:
                  true

              });



          if (itemError) {


            console.error(
              itemError
            );


            alert(
              "Canzone creata, ma errore nell'inserimento in scaletta: " +
              itemError.message
            );


          }


          input.value =
            "";


          input.focus();


          await loadData();


        }

      );



    /* =========================================
       MODIFICA CANZONE
       ========================================= */


    async function editSong(
      song
    ) {


      const result =
        prompt(
          "Titolo canzone:",
          song.title
        );


      if (
        result === null
      ) {

        return;

      }


      const title =
        result.trim();


      if (!title) {

        return;

      }



      const {
        error
      } =
        await supabaseClient

          .from(
            "songs"
          )

          .update({

            title:
              title,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "id",
            song.id
          );


      if (error) {


        alert(
          "Errore: " +
          error.message
        );


        return;


      }


      await loadData();


    }



    /* =========================================
       INCLUDI / ESCLUDI
       ========================================= */


    async function setSongIncluded(
      songId,
      included
    ) {


      const position =
        included
          ? getIncludedSongs().length
          : null;



      const {
        error
      } =
        await supabaseClient

          .from(
            "setlist_items"
          )

          .upsert({

            setlist_id:
              currentSetlistId,

            song_id:
              songId,

            included:
              included,

            position:
              position

          });


      if (error) {


        alert(
          "Errore: " +
          error.message
        );


        return;


      }


      await loadData();


    }



    /* =========================================
       ELIMINA CANZONE
       ========================================= */


    async function deleteSong(
      song
    ) {


      const confirmed =
        confirm(

          'Eliminare definitivamente "' +
          song.title +
          '" dal catalogo di tutti?'

        );


      if (!confirmed) {

        return;

      }



      const {
        error
      } =
        await supabaseClient

          .from(
            "songs"
          )

          .delete()

          .eq(
            "id",
            song.id
          );


      if (error) {


        alert(
          "Errore: " +
          error.message
        );


        return;


      }


      await loadData();


    }



    /* =========================================
       DRAG & DROP
       ========================================= */


    async function syncFromDOM() {


      const includedIds =
        Array
          .from(

            setlistElement
              .querySelectorAll(
                ".song"
              )

          )
          .map(

            element =>
              element.dataset.id

          );


      const excludedIds =
        Array
          .from(

            excludedElement
              .querySelectorAll(
                ".song"
              )

          )
          .map(

            element =>
              element.dataset.id

          );



      const rows =
        [];



      includedIds.forEach(

        (songId, index) => {


          rows.push({

            setlist_id:
              currentSetlistId,

            song_id:
              songId,

            position:
              index,

            included:
              true

          });


        }

      );



      excludedIds.forEach(

        songId => {


          rows.push({

            setlist_id:
              currentSetlistId,

            song_id:
              songId,

            position:
              null,

            included:
              false

          });


        }

      );



      if (
        rows.length === 0
      ) {

        render();

        return;

      }



      const {
        error
      } =
        await supabaseClient

          .from(
            "setlist_items"
          )

          .upsert(
            rows
          );



      if (error) {


        alert(
          "Errore salvataggio scaletta: " +
          error.message
        );


      }


      await loadData();


    }



    new Sortable(

      setlistElement,

      {

        group:
          "songs",

        animation:
          120,

        handle:
          ".drag-handle",

        ghostClass:
          "sortable-ghost",

        chosenClass:
          "sortable-chosen",

        onEnd:
          syncFromDOM

      }

    );



    new Sortable(

      excludedElement,

      {

        group:
          "songs",

        animation:
          120,

        handle:
          ".drag-handle",

        ghostClass:
          "sortable-ghost",

        chosenClass:
          "sortable-chosen",

        onEnd:
          syncFromDOM

      }

    );



    /* =========================================
       LOGOUT
       ========================================= */


    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(

        "click",

        async () => {


          await supabaseClient
            .auth
            .signOut();


          currentUser =
            null;


          currentProfile =
            null;


          currentSetlistId =
            null;


          songs =
            [];


          setlistItems =
            [];


          passwordInput.value =
            "";


          showLogin();


        }

      );



    /* =========================================
       AVVIO PAGINA
       ========================================= */


    async function init() {


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .getSession();


        if (error) {

          throw error;

        }


        if (
          data.session
        ) {


          await startApp();


        }


        else {


          showLogin();


        }


      }


      catch (error) {


        console.error(
          "Errore inizializzazione:",
          error
        );


        loginMessage.textContent =
          "Errore di connessione a Supabase: " +
          error.message;


        showLogin();


      }


    }



    init();


  </script>


</body>

</html>
