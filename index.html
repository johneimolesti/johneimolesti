<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>John & i Molesti — Setlist</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"
    const SUPABASE_URL =
  "https://etzwybamvfpeitkttwrc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CtyexwjoW375UXpjInOuDA_Uz28wWJx";>
    
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: min(360px, 100%);
      background: #181818;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 28px;
    }

    .login-box h1 {
      margin: 0 0 4px;
      font-size: 25px;
    }

    .login-box .subtitle {
      color: #888;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .login-box label {
      display: block;
      margin: 12px 0 5px;
      font-size: 12px;
      color: #aaa;
    }

    .login-box input {
      width: 100%;
      background: #222;
      border: 1px solid #444;
      color: white;
      border-radius: 6px;
      padding: 11px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      margin-top: 18px;
      padding: 11px;
      background: #f0cf21;
      color: #111;
      font-weight: bold;
      font-size: 14px;
    }

    #loginMessage {
      min-height: 18px;
      margin-top: 12px;
      color: #d88;
      font-size: 12px;
      line-height: 1.4;
    }


    /* APP */

    #appScreen {
      display: none;
    }

    header {
      height: 44px;
      padding: 6px 12px;
      border-bottom: 1px solid #333;
      background: #181818;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
    }

    .brand p {
      margin: 1px 0 0;
      color: #777;
      font-size: 10px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #aaa;
    }

    #logoutButton {
      border: 1px solid #444;
      background: #282828;
      color: #ddd;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 10px;
    }

    main {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 6px 10px 10px;
    }

    .new-song {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }

    .new-song input {
      flex: 1;
      height: 30px;
      padding: 4px 8px;
      background: #222;
      border: 1px solid #444;
      border-radius: 5px;
      color: white;
      font-size: 13px;
    }

    .new-song button {
      height: 30px;
      border: 0;
      border-radius: 5px;
      padding: 3px 12px;
      background: #f0cf21;
      color: #111;
      font-size: 11px;
      font-weight: bold;
    }

    .columns {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 6px;
    }

    .panel {
      background: #181818;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
    }

    .panel-header {
      height: 27px;
      padding: 3px 7px;
      border-bottom: 1px solid #333;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 12px;
    }

    .counter {
      color: #777;
      font-size: 9px;
    }

    .song-list {
      min-height: 100px;
      padding: 2px;
    }

    .song {
      min-height: 20px;
      margin-bottom: 1px;
      padding: 1px 4px;

      display: flex;
      align-items: center;
      gap: 4px;

      background: #242424;
      border: 1px solid #333;
      border-radius: 3px;
    }

    .drag-handle {
      width: 12px;
      color: #666;
      cursor: grab;
      font-size: 11px;
      user-select: none;
    }

    .position {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #383838;
      font-size: 8px;
      font-weight: bold;
    }

    .song-title {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      line-height: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .song-actions {
      display: flex;
      gap: 1px;
    }

    .song-actions button {
      height: 17px;
      min-width: 19px;
      padding: 0 3px;

      border: 0;
      border-radius: 2px;
      background: #353535;
      color: #ddd;

      font-size: 9px;
    }

    .song-actions button:hover {
      background: #505050;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 20px;
      font-size: 10px;
    }

    .sortable-ghost {
      opacity: 0.25;
    }

    .sortable-chosen {
      border-color: #f0cf21;
    }

    .footer-note {
      margin-top: 4px;
      text-align: center;
      color: #555;
      font-size: 9px;
    }

    #loadingMessage {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      header {
        height: auto;
        min-height: 48px;
      }

      .columns {
        grid-template-columns: 1fr;
      }

      .new-song input {
        font-size: 16px;
      }

      .song {
        min-height: 34px;
        padding: 4px 6px;
      }

      .song-title {
        font-size: 13px;
      }

      .song-actions button {
        min-width: 28px;
        height: 28px;
      }

      .position {
        width: 22px;
        height: 22px;
        flex-basis: 22px;
        font-size: 10px;
      }

      .drag-handle {
        font-size: 16px;
        width: 18px;
      }
    }
  </style>
</head>

<body>


<!-- LOGIN -->

<section id="loginScreen">

  <form class="login-box" id="loginForm">

    <h1>John & i Molesti</h1>

    <div class="subtitle">
      Setlist Builder
    </div>

    <label for="username">
      Username
    </label>

    <input
      id="username"
      type="text"
      autocomplete="username"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      minlength="6"
      required
    >

    <button type="submit">
      ACCEDI
    </button>

    <div id="loginMessage"></div>

  </form>

</section>



<!-- APP -->

<section id="appScreen">

  <header>

    <div class="brand">
      <h1>John & i Molesti</h1>
      <p>Setlist Builder</p>
    </div>

    <div class="user-area">

      <span id="currentUser"></span>

      <button id="logoutButton" type="button">
        Esci
      </button>

    </div>

  </header>


  <main>

    <form class="new-song" id="newSongForm">

      <input
        id="newSongTitle"
        type="text"
        placeholder="Nuova canzone..."
        autocomplete="off"
        required
      >

      <button type="submit">
        + AGGIUNGI
      </button>

    </form>


    <div id="loadingMessage">
      Caricamento...
    </div>


    <div class="columns" id="setlistArea" style="display:none;">

      <section class="panel">

        <div class="panel-header">

          <h2>LA MIA SCALETTA</h2>

          <span
            class="counter"
            id="setlistCounter">
          </span>

        </div>

        <div
          class="song-list"
          id="setlist">
        </div>

      </section>


      <section class="panel">

        <div class="panel-header">

          <h2>ESCLUSE</h2>

          <span
            class="counter"
            id="excludedCounter">
          </span>

        </div>

        <div
          class="song-list"
          id="excluded">
        </div>

      </section>

    </div>


    <div class="footer-note">
      Trascina i brani per modificare ordine e inclusione.
    </div>

  </main>

</section>



<script>

  /* ==========================================
     INSERISCI QUI I TUOI DATI SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "INCOLLA_QUI_PROJECT_URL";

  const SUPABASE_KEY =
    "INCOLLA_QUI_PUBLISHABLE_KEY";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     STATO APP
     ========================================== */

  let currentUser = null;

  let currentProfile = null;

  let currentSetlistId = null;

  let songs = [];

  let setlistItems = [];


  /* ==========================================
     LOGIN
     ========================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const username =
          document
            .getElementById("username")
            .value
            .trim()
            .toLowerCase();

        const password =
          document
            .getElementById("password")
            .value;

        const message =
          document
            .getElementById("loginMessage");

        message.textContent =
          "Accesso in corso...";


        try {

          /* Verifica se lo username appartiene
             ai 5 membri autorizzati */

          const {
            data: memberData,
            error: memberError
          } =
            await supabaseClient.rpc(
              "check_member",
              {
                p_username: username
              }
            );


          if (memberError) {
            throw memberError;
          }


          if (
            !memberData ||
            memberData.length === 0
          ) {

            message.textContent =
              "Username non riconosciuto.";

            return;
          }


          const member =
            memberData[0];


          const email =
            `${username}@johnimolesti.app`;


          /* ===================================
             PRIMO ACCESSO
             =================================== */

          if (!member.activated) {

            message.textContent =
              "Primo accesso: creazione account...";


            const {
              data,
              error
            } =
              await supabaseClient.auth.signUp({
                email,
                password
              });


            if (error) {
              throw error;
            }


            if (!data.session) {

              message.textContent =
                "Account creato ma Supabase richiede la conferma email. Disattiva Confirm Email nelle impostazioni Authentication.";

              return;
            }


            const {
              error: claimError
            } =
              await supabaseClient.rpc(
                "claim_member",
                {
                  p_username: username
                }
              );


            if (claimError) {
              throw claimError;
            }

          }


          /* ===================================
             ACCESSI SUCCESSIVI
             =================================== */

          else {

            const {
              error
            } =
              await supabaseClient
                .auth
                .signInWithPassword({
                  email,
                  password
                });


            if (error) {

              message.textContent =
                "Password errata.";

              return;
            }

          }


          message.textContent = "";

          await startApp();

        }

        catch (error) {

          console.error(error);

          message.textContent =
            error.message ||
            "Errore durante l'accesso.";

        }

      }
    );


  /* ==========================================
     AVVIO APP
     ========================================== */

  async function startApp() {

    const {
      data: { user }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {
      showLogin();
      return;
    }


    currentUser = user;


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    if (profileError) {

      console.error(profileError);

      await supabaseClient.auth.signOut();

      showLogin();

      document
        .getElementById("loginMessage")
        .textContent =
        "Profilo utente non trovato.";

      return;
    }


    currentProfile = profile;


    document
      .getElementById("currentUser")
      .textContent =
      profile.display_name;


    showApp();


    await ensureDefaultSetlist();

    await loadData();

  }


  /* ==========================================
     SCALETTA PREDEFINITA
     ========================================== */

  async function ensureDefaultSetlist() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("setlists")
        .select("id")
        .eq(
          "owner_id",
          currentUser.id
        )
        .eq(
          "name",
          "Scaletta ideale"
        )
        .limit(1);


    if (error) {
      throw error;
    }


    if (data.length > 0) {

      currentSetlistId =
        data[0].id;

      return;
    }


    const {
      data: created,
      error: createError
    } =
      await supabaseClient
        .from("setlists")
        .insert({
          owner_id:
            currentUser.id,

          name:
            "Scaletta ideale"
        })
        .select("id")
        .single();


    if (createError) {
      throw createError;
    }


    currentSetlistId =
      created.id;

  }


  /* ==========================================
     CARICAMENTO DATI
     ========================================== */

  async function loadData() {

    document
      .getElementById("loadingMessage")
      .style.display =
      "block";


    document
      .getElementById("setlistArea")
      .style.display =
      "none";


    const {
      data: songsData,
      error: songsError
    } =
      await supabaseClient
        .from("songs")
        .select("*")
        .eq("active", true)
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (songsError) {
      throw songsError;
    }


    songs =
      songsData || [];


    let {
      data: itemsData,
      error: itemsError
    } =
      await supabaseClient
        .from("setlist_items")
        .select("*")
        .eq(
          "setlist_id",
          currentSetlistId
        );


    if (itemsError) {
      throw itemsError;
    }


    setlistItems =
      itemsData || [];


    /*
      Se questa è la prima volta che
      l'utente apre la sua scaletta,
      inseriamo tutte le canzoni
      esistenti.
    */

    if (
      setlistItems.length === 0 &&
      songs.length > 0
    ) {

      const initialItems =
        songs.map(
          (song, index) => ({
            setlist_id:
              currentSetlistId,

            song_id:
              song.id,

            position:
              index,

            included:
              true
          })
        );


      const {
        error
      } =
        await supabaseClient
          .from("setlist_items")
          .insert(initialItems);


      if (error) {
        throw error;
      }


      setlistItems =
        initialItems;

    }


    render();


    document
      .getElementById("loadingMessage")
      .style.display =
      "none";


    document
      .getElementById("setlistArea")
      .style.display =
      "grid";

  }


  /* ==========================================
     LISTE
     ========================================== */

  function getIncludedSongs() {

    const itemsMap =
      new Map(
        setlistItems.map(
          item => [
            item.song_id,
            item
          ]
        )
      );


    return songs
      .filter(song => {

        const item =
          itemsMap.get(song.id);

        return item &&
          item.included;

      })
      .sort((a, b) => {

        return (
          itemsMap.get(a.id).position -
          itemsMap.get(b.id).position
        );

      });

  }


  function getExcludedSongs() {

    const itemsMap =
      new Map(
        setlistItems.map(
          item => [
            item.song_id,
            item
          ]
        )
      );


    return songs
      .filter(song => {

        const item =
          itemsMap.get(song.id);

        return (
          !item ||
          !item.included
        );

      })
      .sort(
        (a, b) =>
          a.title.localeCompare(
            b.title
          )
      );

  }


  /* ==========================================
     RENDER
     ========================================== */

  function render() {

    const setlist =
      document.getElementById(
        "setlist"
      );

    const excluded =
      document.getElementById(
        "excluded"
      );


    setlist.innerHTML = "";
    excluded.innerHTML = "";


    const includedSongs =
      getIncludedSongs();

    const excludedSongs =
      getExcludedSongs();


    includedSongs.forEach(
      (song, index) => {

        setlist.appendChild(
          createSongElement(
            song,
            index,
            true
          )
        );

      }
    );


    excludedSongs.forEach(
      (song, index) => {

        excluded.appendChild(
          createSongElement(
            song,
            index,
            false
          )
        );

      }
    );


    if (
      includedSongs.length === 0
    ) {

      setlist.innerHTML =
        '<div class="empty">Nessun brano in scaletta</div>';

    }


    if (
      excludedSongs.length === 0
    ) {

      excluded.innerHTML =
        '<div class="empty">Nessun brano escluso</div>';

    }


    document
      .getElementById(
        "setlistCounter"
      )
      .textContent =
      `${includedSongs.length} brani`;


    document
      .getElementById(
        "excludedCounter"
      )
      .textContent =
      `${excludedSongs.length} brani`;

  }


  function createSongElement(
    song,
    index,
    included
  ) {

    const element =
      document.createElement("div");


    element.className =
      "song";


    element.dataset.id =
      song.id;


    const drag =
      document.createElement(
        "span"
      );


    drag.className =
      "drag-handle";

    drag.textContent =
      "☰";


    const position =
      document.createElement(
        "span"
      );


    position.className =
      "position";

    position.textContent =
      index + 1;


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "song-title";

    title.textContent =
      song.title;


    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "song-actions";


    const editButton =
      document.createElement(
        "button"
      );


    editButton.type =
      "button";

    editButton.textContent =
      "✎";

    editButton.title =
      "Modifica canzone";


    editButton.addEventListener(
      "click",
      () => editSong(song)
    );


    actions.appendChild(
      editButton
    );


    if (included) {

      const excludeButton =
        document.createElement(
          "button"
        );


      excludeButton.type =
        "button";

      excludeButton.textContent =
        "×";

      excludeButton.title =
        "Escludi";


      excludeButton.addEventListener(
        "click",
        () =>
          setSongIncluded(
            song.id,
            false
          )
      );


      actions.appendChild(
        excludeButton
      );

    }

    else {

      const includeButton =
        document.createElement(
          "button"
        );


      includeButton.type =
        "button";

      includeButton.textContent =
        "+";

      includeButton.title =
        "Inserisci";


      includeButton.addEventListener(
        "click",
        () =>
          setSongIncluded(
            song.id,
            true
          )
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.type =
        "button";

      deleteButton.textContent =
        "🗑";

      deleteButton.title =
        "Elimina definitivamente";


      deleteButton.addEventListener(
        "click",
        () =>
          deleteSong(song)
      );


      actions.appendChild(
        includeButton
      );

      actions.appendChild(
        deleteButton
      );

    }


    element.appendChild(
      drag
    );


    if (included) {

      element.appendChild(
        position
      );

    }


    element.appendChild(
      title
    );

    element.appendChild(
      actions
    );


    return element;

  }


  /* ==========================================
     CREA CANZONE
     ========================================== */

  document
    .getElementById(
      "newSongForm"
    )
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const input =
          document.getElementById(
            "newSongTitle"
          );


        const title =
          input.value.trim();


        if (!title) {
          return;
        }


        const {
          data: newSong,
          error
        } =
          await supabaseClient
            .from("songs")
            .insert({
              title
            })
            .select("*")
            .single();


        if (error) {

          alert(
            "Errore: " +
            error.message
          );

          return;

        }


        const position =
          getIncludedSongs()
            .length;


        const {
          error: itemError
        } =
          await supabaseClient
            .from(
              "setlist_items"
            )
            .insert({
              setlist_id:
                currentSetlistId,

              song_id:
                newSong.id,

              position,

              included:
                true
            });


        if (itemError) {

          alert(
            "Errore: " +
            itemError.message
          );

        }


        input.value = "";

        await loadData();

      }
    );


  /* ==========================================
     MODIFICA CANZONE
     ========================================== */

  async function editSong(song) {

    const newTitle =
      prompt(
        "Titolo:",
        song.title
      );


    if (newTitle === null) {
      return;
    }


    const title =
      newTitle.trim();


    if (!title) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("songs")
        .update({
          title
        })
        .eq(
          "id",
          song.id
        );


    if (error) {

      alert(
        "Errore: " +
        error.message
      );

      return;

    }


    await loadData();

  }


  /* ==========================================
     INCLUDI / ESCLUDI
     ========================================== */

  async function setSongIncluded(
    songId,
    included
  ) {

    const position =
      included
        ? getIncludedSongs().length
        : null;


    const {
      error
    } =
      await supabaseClient
        .from(
          "setlist_items"
        )
        .upsert({
          setlist_id:
            currentSetlistId,

          song_id:
            songId,

          included,

          position
        });


    if (error) {

      alert(
        "Errore: " +
        error.message
      );

      return;

    }


    await loadData();

  }


  /* ==========================================
     ELIMINA CANZONE
     ========================================== */

  async function deleteSong(song) {

    const confirmed =
      confirm(
        `Eliminare definitivamente "${song.title}" dal catalogo di tutti?`
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq(
          "id",
          song.id
        );


    if (error) {

      alert(
        "Errore: " +
        error.message
      );

      return;

    }


    await loadData();

  }


  /* ==========================================
     DRAG & DROP
     ========================================== */

  async function syncFromDOM() {

    const includedIds =
      Array
        .from(
          document
            .getElementById(
              "setlist"
            )
            .querySelectorAll(
              ".song"
            )
        )
        .map(
          element =>
            element.dataset.id
        );


    const excludedIds =
      Array
        .from(
          document
            .getElementById(
              "excluded"
            )
            .querySelectorAll(
              ".song"
            )
        )
        .map(
          element =>
            element.dataset.id
        );


    const rows = [];


    includedIds.forEach(
      (songId, index) => {

        rows.push({
          setlist_id:
            currentSetlistId,

          song_id:
            songId,

          included:
            true,

          position:
            index
        });

      }
    );


    excludedIds.forEach(
      songId => {

        rows.push({
          setlist_id:
            currentSetlistId,

          song_id:
            songId,

          included:
            false,

          position:
            null
        });

      }
    );


    if (
      rows.length === 0
    ) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from(
          "setlist_items"
        )
        .upsert(rows);


    if (error) {

      alert(
        "Errore salvataggio: " +
        error.message
      );

    }


    await loadData();

  }


  new Sortable(
    document.getElementById(
      "setlist"
    ),
    {
      group: "songs",
      animation: 100,
      handle:
        ".drag-handle",
      onEnd:
        syncFromDOM
    }
  );


  new Sortable(
    document.getElementById(
      "excluded"
    ),
    {
      group: "songs",
      animation: 100,
      handle:
        ".drag-handle",
      onEnd:
        syncFromDOM
    }
  );


  /* ==========================================
     LOGOUT
     ========================================== */

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await supabaseClient
          .auth
          .signOut();

        location.reload();

      }
    );


  /* ==========================================
     SCHERMATE
     ========================================== */

  function showLogin() {

    document
      .getElementById(
        "loginScreen"
      )
      .style.display =
      "flex";


    document
      .getElementById(
        "appScreen"
      )
      .style.display =
      "none";

  }


  function showApp() {

    document
      .getElementById(
        "loginScreen"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "appScreen"
      )
      .style.display =
      "block";

  }


  /* ==========================================
     SESSIONE GIÀ ATTIVA
     ========================================== */

  async function init() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (session) {

      await startApp();

    }

    else {

      showLogin();

    }

  }


  init();

</script>

</body>
</html>
